# ─────────────────────────────────────────────────────────────────
# Logstash Pipeline Configuration
# Kafka → Transform → Elasticsearch
# ─────────────────────────────────────────────────────────────────

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["scored-events"]
    group_id          => "logstash-consumer-group"
    codec             => json
    consumer_threads  => 2
    auto_offset_reset => "latest"
  }
}

filter {
  # Parse timestamp from event
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add index metadata
  mutate {
    add_field => {
      "[@metadata][index]" => "security-events"
    }
  }

  # Compute TI composite score if not already set
  ruby {
    code => "
      abuse = event.get('ti_abuseipdb_score') || 0.0
      otx   = (event.get('ti_otx_pulse_count') || 0) > 0 ? 1.0 : 0.0
      event.set('ti_composite_score', (abuse * 0.6 + otx * 0.4).round(3))
    "
  }

  # Normalise risk_tier to uppercase
  mutate {
    uppercase => ["risk_tier", "ai_attack_class", "protocol"]
  }

  # Remove internal Kafka metadata fields
  mutate {
    remove_field => ["[@metadata]"]
  }
}

output {
  elasticsearch {
    hosts            => ["http://elasticsearch:9200"]
    index            => "security-events-%{+YYYY.MM.dd}"
    document_id      => "%{event_id}"
    action           => "index"
    manage_template  => false
  }

  # Debug: also print to stdout in development
  # stdout { codec => rubydebug }
}
